name: Documentation Pages

on:
  push:
    branches:
      - abuild-gh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  documentation:
    name: Build documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out Aflex and Ayacc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the documentation
        shell: bash
        run: .github/ci/run .github/ci/build-pages

      - name: Verify the Pages tree
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/site/index.html
          test -s .github/site/aflex.html
          test -s .github/site/ayacc.html
          grep -Fq 'Aflex and Ayacc 1.4a' .github/site/index.html
          grep -Fq 'lexical analyzer generator for Ada' .github/site/aflex.html
          grep -Fq 'LALR(1) parser generator' .github/site/ayacc.html
          test -z "$(find .github/site -type l -print -quit)"

      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .github/site/
          retention-days: 7

  deploy-pages:
    name: Deploy GitHub Pages
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy the documentation site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
